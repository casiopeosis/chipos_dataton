worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    application/json application/geo+json text/css application/javascript;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # data/outputs/*.json (predicciones, diagnostico) montado en /data-outputs
        location ~ ^/data/(prediccion_ageb\.json|prediccion_alcaldia\.json|diagnostico\.json|backtest\.json)$ {
            alias /data-outputs/$1;
        }

        # data/reference/*.geojson montado en /data-reference
        location ~ ^/data/(alcaldias\.geojson|ageb_cdmx_simplificado\.geojson)$ {
            alias /data-reference/$1;
        }
    }
}
